# dshmarket submission entry for dsh-answer-reviewer.
#
# The entry is ALREADY MERGED — data/plugins/bycall__dsh-answer-reviewer.yml
# is in awesome-dsh-plugin/main (added by the add/dsh-answer-reviewer branch).
# So this file is the source of truth for *updates*, not a fresh submission:
# copy it over the merged file on a branch off upstream/main and PR that diff.
#
# Update PR shape (verified against the live repo on 2026-09-14):
#   - the PR carries ONLY data/plugins/<owner>__<repo>.yml. The READMEs are a
#     generated artifact and sync-readme.yml regenerates them on main after
#     merge; pr-check.yml accepts either "yml only" or "yml + regenerated
#     READMEs that match", but the maintainers' pull_request_template.md asks
#     contributors not to commit them, and yml-only avoids conflicts over
#     generated lines with unrelated submissions in the same category.
#   - the editable key is `description`; url/name/category should not drift.
#
# Rules enforced by CI (pr-check.yml, then pr-gate.yml via workflow_run):
#   - repo must contain a dsh.bundle declaration (package.json has dsh.bundle.patch) ✓
#   - repo must exist, not be archived, and be >= 1 day old. The old >= 10
#     commit floor was DROPPED on 2026-09-03 — it measured habit, not quality.
#   - filename must equal slugFor(url): <owner>__<repo>.yml, exactly one level
#     deep under data/plugins/ (readEntries() globs data/plugins/*.yml and is
#     not recursive, so any other depth is silently skipped by every check)
#   - only keys: url, name, category, description, tarball (no `npm:` key — npm
#     mapping is resolved automatically from the repository)
url: https://github.com/bycall/dsh-answer-reviewer
name: dsh-answer-reviewer
category: agi
description:
  en: "Agentic answer reviewer for DeepSeek Harness: each final assistant turn is re-reviewed by a separate LLM graded 1-100; below-threshold scores steer the agent back with concrete feedback. The score is shown as a chip on the answer's action row (green pass / red needs-work, with retry count and reason on hover). Live gate config over a 127.0.0.1 HTTP server, plus a collapsed dock above the composer and an optional right-sidebar tab via dsh-better-sidebar."
  zh: "智能体回答审查器：每一轮 agent 的最终输出由独立 LLM 重新打分（1-100），低于阈值时携带具体反馈引导 agent 自我修正；评分以角标形式展示在该回答的操作行上（通过=绿、未达标=红，悬停可见重试次数与原因）。闸值配置经 127.0.0.1 本地 HTTP 服务实时修改，并支持输入框上方的折叠面板与 dsh-better-sidebar 侧栏配置页。"
